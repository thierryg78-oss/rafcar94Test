<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAFCAR94 — Gestion Garage</title>
<!-- Polices systeme uniquement : aucune ressource externe requise, le fichier fonctionne meme hors ligne -->
<style>
:root{
  --bg:#14171c; --surface:#1b1f26; --surface2:#242931; --surface3:#2c323c;
  --border:#333a46; --accent:#ff6b1a; --accent-dim:#ff6b1a33; --plate-yellow:#ffc942;
  --plate-blue:#1c4fa3; --text:#ecece5; --muted:#8b92a0; --green:#4caf6d; --green-dim:#4caf6d22;
  --red:#e5484d; --red-dim:#e5484d22; --amber:#ffb454; --amber-dim:#ffb45422;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,Inter,Arial,sans-serif;font-size:14px;}
h1,h2,h3,h4,.display{font-family:'Arial Narrow',Oswald,'Helvetica Neue',Arial,sans-serif;font-stretch:condensed;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:13px;width:100%;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;font-weight:600;}
.field{margin-bottom:12px;}
.btn{background:var(--surface3);border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:7px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.15s;}
.btn:hover{border-color:var(--accent);}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#1a1a1a;}
.btn-accent:hover{background:#ff7f3d;}
.btn-ghost{background:transparent;border:1px solid var(--border);}
.btn-danger{background:transparent;border:1px solid var(--red);color:var(--red);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.pill-green{background:var(--green-dim);color:var(--green);}
.pill-amber{background:var(--amber-dim);color:var(--amber);}
.pill-red{background:var(--red-dim);color:var(--red);}
.pill-muted{background:var(--surface3);color:var(--muted);}
#app{display:flex;min-height:100vh;}

/* SIDEBAR */
#sidebar{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.logo-badge{margin:18px 16px 10px;padding:10px;background:radial-gradient(circle at 50% 30%,#1e2229,#101319);border-radius:12px;position:relative;overflow:hidden;box-shadow:0 4px 14px #0006;display:flex;flex-direction:column;align-items:center;text-align:center;border:1px solid var(--border);}
.logo-badge img{width:84px;height:84px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #0006, 0 4px 12px #000a;}
.logo-badge .name{font-family:'Arial Narrow',Oswald,'Helvetica Neue',Arial,sans-serif;font-stretch:condensed;font-weight:700;font-weight:700;font-size:16px;color:#fff;letter-spacing:.03em;margin-top:8px;}
.logo-badge .sub{font-size:9px;color:var(--muted);font-weight:600;letter-spacing:.1em;margin-top:1px;}
nav.tabs{padding:8px;display:flex;flex-direction:column;gap:2px;flex:1;}
nav.tabs button{text-align:left;background:transparent;border:none;color:var(--muted);padding:10px 12px;border-radius:8px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:10px;}
nav.tabs button:hover{background:var(--surface2);color:var(--text);}
nav.tabs button.active{background:var(--accent-dim);color:var(--accent);}
.side-foot{padding:14px;font-size:10.5px;color:var(--muted);border-top:1px solid var(--border);}

/* MAIN */
#main{flex:1;padding:26px 32px;max-width:1400px;}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;}
.pagehead h1{font-size:26px;margin:0;}
.pagehead p{color:var(--muted);margin:2px 0 0;font-size:13px;}

/* DASHBOARD */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px;}
.kpi{padding:16px 18px;}
.kpi .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.kpi .val{font-family:'Arial Narrow',Oswald,'Helvetica Neue',Arial,sans-serif;font-stretch:condensed;font-weight:700;font-size:28px;margin-top:4px;}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:2px;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
@media(max-width:1000px){.two-col{grid-template-columns:1fr;}}
.section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:14px 18px 8px;}
.alert-row{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-top:1px solid var(--border);font-size:12.5px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:8px 14px;border-bottom:1px solid var(--border);}
td{padding:9px 14px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}

/* VEHICLE GRID / PLATE CARD */
.veh-toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.veh-toolbar select,.veh-toolbar input{width:auto;}
.veh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;}
.vcard{padding:0;overflow:hidden;position:relative;cursor:pointer;transition:.15s;}
.vcard:hover{border-color:var(--accent);transform:translateY(-2px);}
.vcard .ribbon{position:absolute;top:10px;right:-32px;transform:rotate(40deg);padding:3px 40px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;z-index:2;}
.ribbon.vendu{background:var(--red);color:#fff;}
.ribbon.reserve{background:var(--amber);color:#241900;}
.ribbon.dispo{background:var(--green);color:#04180b;}
.vcard-top{padding:16px 16px 10px;}
.vcard-top .titre{font-family:'Arial Narrow',Oswald,'Helvetica Neue',Arial,sans-serif;font-stretch:condensed;font-weight:700;font-size:18px;}
.vcard-top .sub{color:var(--muted);font-size:12px;margin-top:2px;}
.plate{display:inline-flex;align-items:center;background:var(--plate-yellow);color:#0d0d0d;border-radius:4px;overflow:hidden;margin-top:10px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,'JetBrains Mono',monospace;font-weight:700;font-size:14px;letter-spacing:.08em;box-shadow:0 2px 6px #0005;}
.plate .eu{background:var(--plate-blue);color:#fff;padding:4px 5px;font-size:8px;font-weight:700;align-self:stretch;display:flex;align-items:center;}
.plate .num{padding:4px 10px;}
.vcard-mid{display:flex;justify-content:space-between;padding:10px 16px;border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);background:var(--surface2);}
.vcard-mid div{text-align:center;flex:1;}
.vcard-mid .v{font-family:'Arial Narrow',Oswald,'Helvetica Neue',Arial,sans-serif;font-stretch:condensed;font-weight:700;font-size:15px;}
.vcard-mid .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.vcard-bot{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
.vcard-bot .prix{font-family:'Arial Narrow',Oswald,'Helvetica Neue',Arial,sans-serif;font-stretch:condensed;font-weight:700;font-size:20px;color:var(--accent);}

/* MODAL */
.overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:30px 16px;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:880px;margin:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);}
.modal-body{padding:20px 22px;max-height:75vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.close-x{background:none;border:none;color:var(--muted);font-size:20px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px;}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap;}
.subtabs button{background:none;border:none;color:var(--muted);padding:8px 14px;font-weight:600;font-size:12.5px;border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.03em;}
.subtabs button.active{color:var(--accent);border-color:var(--accent);}
.item-row{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.item-row .meta{font-size:11px;color:var(--muted);margin-top:3px;}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:13px;}

/* DOC PRINT PREVIEW */
.doc-preview{background:#fff;color:#111;padding:34px 40px;font-family:-apple-system,'Segoe UI',Roboto,Inter,Arial,sans-serif;font-size:12.5px;border-radius:6px;line-height:1.55;}
.doc-preview h2{font-family:'Arial Narrow',Oswald,'Helvetica Neue',Arial,sans-serif;font-stretch:condensed;font-weight:700;text-align:center;font-size:17px;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:16px;text-transform:uppercase;}
.doc-preview .dochead{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.doc-preview .dochead img{width:54px;height:54px;border-radius:50%;object-fit:cover;}
.doc-preview .dochead .soc{font-family:'Arial Narrow',Oswald,'Helvetica Neue',Arial,sans-serif;font-stretch:condensed;font-weight:700;font-size:15px;letter-spacing:.03em;}
.doc-preview .dochead .soc small{display:block;font-family:-apple-system,'Segoe UI',Roboto,Inter,Arial,sans-serif;font-size:10px;color:#666;font-weight:400;letter-spacing:.02em;}
.doc-preview .docsec{margin-bottom:14px;}
.doc-preview .doclabel{font-weight:700;text-transform:uppercase;font-size:10.5px;color:#555;letter-spacing:.04em;margin-bottom:4px;}
.doc-preview .box{border:1px solid #bbb;border-radius:4px;padding:10px 12px;margin-bottom:8px;}
.doc-preview table{font-size:12px;}
.doc-preview td{border:1px solid #ccc;padding:6px 8px;}
.sign-row{display:flex;justify-content:space-between;margin-top:26px;}
.sign-box{width:46%;border-top:1px solid #333;padding-top:6px;font-size:11px;color:#444;}
@media print{
  body *{visibility:hidden;}
  #printArea,#printArea *{visibility:visible;}
  #printArea{position:absolute;left:0;top:0;width:100%;}
}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface3);border:1px solid var(--accent);padding:12px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:100;box-shadow:0 6px 20px #000a;}
.loading{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted);font-family:'Arial Narrow',Oswald,'Helvetica Neue',Arial,sans-serif;font-stretch:condensed;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:6px;}
.helpbar{font-size:11.5px;color:var(--muted);background:var(--surface2);border:1px dashed var(--border);border-radius:8px;padding:10px 14px;margin-bottom:16px;}
@media(max-width:860px){
  #app{flex-direction:column;}
  #sidebar{width:100%;height:auto;position:relative;top:auto;flex-direction:column;align-items:stretch;padding:10px 12px;}
  .logo-badge{flex-direction:row;margin:0 0 10px;padding:8px 10px;gap:8px;flex:none;justify-content:flex-start;}
  .logo-badge img{width:36px;height:36px;}
  .logo-badge .name{margin-top:0;font-size:14px;white-space:nowrap;}
  .logo-badge .sub{display:none;}
  nav.tabs{flex-direction:row;flex-wrap:wrap;flex:none;padding:0;gap:6px;}
  nav.tabs button{padding:8px 10px;font-size:11.5px;white-space:nowrap;flex:none;}
  .side-foot{display:none;}
  #main{padding:16px;max-width:100%;}
  .pagehead{flex-direction:column;align-items:flex-start;gap:10px;}
  .grid2,.grid3{grid-template-columns:1fr;}
  .veh-grid{grid-template-columns:1fr;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.chk input{width:16px;height:16px;flex:none;}
</style>
</head>
<body>
<div id="app"><div class="loading">Chargement RAFCAR94…</div></div>
<script>
// Filet de sécurité : si l'application ne s'est pas chargée après quelques secondes
// (certains navigateurs mobiles en mode "in-app" bloquent le JavaScript des fichiers locaux),
// on affiche un message clair avec la solution plutôt qu'une page figée.
setTimeout(function(){
  var appEl = document.getElementById('app');
  if(appEl && appEl.textContent.indexOf('Chargement RAFCAR94') !== -1){
    appEl.innerHTML = '<div style="max-width:520px;margin:60px auto;padding:28px;text-align:left;color:#ecece5;font-family:sans-serif;line-height:1.7;background:#1b1f26;border-radius:12px;border:1px solid #333a46">' +
      '<h2 style="margin:0 0 12px;font-size:19px">La page ne s\'affiche pas correctement</h2>' +
      '<p style="color:#8b92a0;font-size:14px;margin:0 0 14px">Ton navigateur bloque probablement le JavaScript pour ce fichier local. Essaie dans l\'ordre :</p>' +
      '<p style="font-size:14px;margin:0 0 8px"><b>1.</b> Recharge la page (icône ↻ dans la barre d\'adresse)</p>' +
      '<p style="font-size:14px;margin:0 0 8px"><b>2.</b> Active « Affichage bureau » / « Desktop site » dans le menu du navigateur (⋮ ou icône « aA »)</p>' +
      '<p style="font-size:14px;margin:0"><b>3.</b> Ouvre le fichier directement avec Chrome depuis l\'appli <b>Fichiers</b>, pas depuis un aperçu WhatsApp/Drive/Mail</p>' +
      '</div>';
  }
}, 3500);
</script>

let state = null;
let ui = { tab:'dashboard', vehFilter:'tous', vehSearch:'', openVeh:null, vehSubTab:'infos', certVeh:'', contratVeh:'', factureVeh:'', modal:null, lang:'fr' };
const STORAGE_KEY = 'garage-data';

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('fr-FR') : '—';
const fmtEUR = (n) => (n===''||n===null||n===undefined||isNaN(n)) ? '—' : Number(n).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const totalFrais = (v) => (Number(v.fraisImportation)||0) + ((v.frais||[]).reduce((s,f)=>s+(Number(f.montant)||0),0));
const margeBrute = (v) => (Number(v.prixVente)||0) - (Number(v.prixAchat)||0);
const margeNette = (v) => margeBrute(v) - totalFrais(v);

function defaultState(){
  return {
    societe: { nom:'RAFCAR94', forme:'SAS', capital:'10 000 €', representant:'MAJID GUENIA', adresse:'110 rue de Fontenay CS 20010', cp:'94300', ville:'Vincennes Cedex', siret:'En cours d\'immatriculation', tel:'+33 7 59 18 61 54', email:'rafcar94.contact@gmail.com', rcs:'' },
    vehicles: [],
    compta: [],
    contacts: []
  };
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){ state = JSON.parse(res.value); }
    else { state = defaultState(); }
  }catch(e){ state = defaultState(); }
  if(!state.societe) state.societe = defaultState().societe;
  if(!state.vehicles) state.vehicles = [];
  if(!state.compta) state.compta = [];
  if(!state.contacts) state.contacts = [];
  render();
}
let saving=false;
async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  }catch(e){ console.error('Erreur sauvegarde', e); toast('⚠ Erreur de sauvegarde — réessaie'); }
}
function persist(){ saveState(); render(); }

function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600);
}
function resizeImageFile(file, maxWidth, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Alerts: entretien items due within 30 days & not done, or CT expiring */
function getAlerts(){
  const alerts=[];
  const soon = new Date(); soon.setDate(soon.getDate()+30);
  state.vehicles.forEach(v=>{
    if(v.statut==='vendu') return;
    (v.entretien||[]).forEach(e=>{
      if(!e.fait && e.prochaineDate){
        const d = new Date(e.prochaineDate);
        const overdue = d < new Date();
        if(d <= soon){
          alerts.push({vehId:v.id, label:`${v.marque} ${v.modele} (${v.immatriculation||'—'})`, txt:`${e.type} — ${overdue?'en retard':'à prévoir'} le ${fmtDate(e.prochaineDate)}`, overdue});
        }
      }
    });
    if(v.ctDate){
      const d = new Date(v.ctDate);
      const overdue = d < new Date();
      if(d <= soon){
        alerts.push({vehId:v.id, label:`${v.marque} ${v.modele} (${v.immatriculation||'—'})`, txt:`Contrôle technique — ${overdue?'expiré':'expire'} le ${fmtDate(v.ctDate)}`, overdue});
      }
    }
  });
  return alerts.sort((a,b)=> (a.overdue===b.overdue)?0:(a.overdue?-1:1));
}

function statsByMarque(){
  const map={};
  soldVehicles().forEach(v=>{
    const k=v.marque||'Autre';
    if(!map[k]) map[k]={marque:k,count:0,totalDays:0,totalPrix:0};
    map[k].count++;
    if(v.dateAchat && v.dateVente) map[k].totalDays += Math.max(daysBetween(v.dateAchat,v.dateVente),0);
    map[k].totalPrix += Number(v.prixVente)||0;
  });
  return Object.values(map).map(m=>({...m, avgDays: m.count? Math.round(m.totalDays/m.count):0, avgPrix: m.count? Math.round(m.totalPrix/m.count):0}))
    .sort((a,b)=>a.avgDays-b.avgDays);
}

  const caMois = ventesMois.reduce((s,v)=>s+(Number(v.prixVente)||0),0);
  const valeurStock = stock.reduce((s,v)=>s+(Number(v.prixVenteAffiche||v.prixVente)||Number(v.prixAchat)||0),0);
  const avgDelai = vendus.length ? Math.round(vendus.reduce((s,v)=> s+(v.dateAchat&&v.dateVente?Math.max(daysBetween(v.dateAchat,v.dateVente),0):0),0)/vendus.length) : 0;
  const avgPrixVente = vendus.length ? Math.round(vendus.reduce((s,v)=>s+(Number(v.prixVente)||0),0)/vendus.length) : 0;
  const avgMargeBrute = vendus.length ? Math.round(vendus.reduce((s,v)=>s+margeBrute(v),0)/vendus.length) : 0;
  const avgMargeNette = vendus.length ? Math.round(vendus.reduce((s,v)=>s+margeNette(v),0)/vendus.length) : 0;

  const alerts = getAlerts();
  const marqueStats = statsByMarque();

  return `

  <div class="kpi-grid">

    <div class="card kpi"><div class="lbl">Ventes ce mois-ci</div><div class="val">${ventesMois.length}</div><div class="sub">CA ${fmtEUR(caMois)}</div></div>
    <div class="card kpi"><div class="lbl">Délai moyen de vente</div><div class="val">${avgDelai} j</div><div class="sub">Sur ${vendus.length} véhicule(s) vendu(s)</div></div>
    <div class="card kpi"><div class="lbl">Prix de vente moyen</div><div class="val">${fmtEUR(avgPrixVente)}</div><div class="sub">Marge nette moy. ${fmtEUR(avgMargeNette)}</div></div>
    <div class="card kpi"><div class="lbl">Marge brute moyenne</div><div class="val">${fmtEUR(avgMargeBrute)}</div><div class="sub">Avant frais engagés</div></div>
    <div class="card kpi"><div class="lbl">Marge nette totale</div><div class="val" style="color:${totalMargeNette>=0?'var(--green)':'var(--red)'}">${fmtEUR(totalMargeNette)}</div><div class="sub">Sur tous les véhicules vendus</div></div>
  </div>
  <div class="two-col">
    <div class="card">
      <div class="section-title">⚠️ Alertes entretien &amp; contrôle technique</div>
      ${alerts.length? alerts.map(a=>`<div class="alert-row"><span>${a.label} — ${a.txt}</span><span class="pill ${a.overdue?'pill-red':'pill-amber'}">${a.overdue?'Retard':'Bientôt'}</span></div>`).join('') : '<div class="empty">Aucune alerte à venir 👍</div>'}
    </div>

/* ============== COMPTA / LIVRE DE POLICE ============== */
function renderCompta(){
  const rows = state.compta.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let solde=0;
  const withSolde = rows.map(r=>{ solde += (r.type==='vente'? Number(r.montant): -Number(r.montant)); return {...r, solde}; });
  const totalAchats = rows.filter(r=>r.type==='achat').reduce((s,r)=>s+Number(r.montant||0),0);
  const totalVentes = rows.filter(r=>r.type==='vente').reduce((s,r)=>s+Number(r.montant||0),0);
  return `
  <div class="pagehead"><div><h1>Livre de police</h1><p>Registre chronologique des achats et ventes de véhicules — comptabilité RAFCAR94.</p></div>
  <button class="btn btn-accent" data-action="new-compta">+ Écriture manuelle</button></div>
  <div class="kpi-grid" style="margin-bottom:16px">
    <div class="card kpi"><div class="lbl">Total achats</div><div class="val" style="color:var(--red)">${fmtEUR(totalAchats)}</div></div>
    <div class="card kpi"><div class="lbl">Total ventes</div><div class="val" style="color:var(--green)">${fmtEUR(totalVentes)}</div></div>
    <div class="card kpi"><div class="lbl">Marge nette</div><div class="val">${fmtEUR(totalVentes-totalAchats)}</div></div>
  </div>
  <div class="card">
    <table>
      <tr><th>Date</th><th>Type</th><th>Véhicule</th><th>Tiers</th><th>Montant</th><th>Solde cumulé</th><th></th></tr>
      ${withSolde.length? withSolde.map(r=>`
        <tr>
          <td>${fmtDate(r.date)}</td>
          <td><span class="pill ${r.type==='achat'?'pill-red':(r.type==='vente'?'pill-green':'pill-muted')}">${r.type}</span></td>
          <td>${r.vehLabel||'—'}</td>
          <td>${r.tiers||'—'}</td>
          <td>${r.type==='achat'?'-':'+'} ${fmtEUR(r.montant)}</td>
          <td>${fmtEUR(r.solde)}</td>
          <td><button class="btn btn-danger btn-sm" data-action="del-compta" data-id="${r.id}">✕</button></td>
        </tr>`).join('') : `<tr><td colspan="7" class="empty">Aucune écriture. Les achats/ventes de véhicules alimentent automatiquement ce registre.</td></tr>`}
    </table>
  </div>
  `;
}

          ${vehOptions.map(v=>`<option value="${v.id}">${v.marque} ${v.modele} — ${v.immatriculation||'sans plaque'}</option>`).join('')}

  <div class="card">
    <table>
      <tr><th>Date</th><th>Client</th><th>Contact</th><th>Véhicule</th><th>Message</th><th>Statut</th><th></th></tr>
      ${contacts.length? contacts.map(c=>{
        const v = c.vehId? getVeh(c.vehId): null;

          <td>${fmtDate(c.date)}</td>

}

/* ============== EVENT HANDLERS ============== */
function attachHandlers(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ ui.tab=b.dataset.nav; render(); });
  const pubBtn = app.querySelector('[data-action="goto-public"]');
  if(pubBtn) pubBtn.onclick = goPublic;

  app.querySelectorAll('[data-bind]').forEach(el=>{
    el.onchange = ()=>{ ui[el.dataset.bind] = el.value; render(); };
    if(el.tagName==='INPUT') el.oninput = ()=>{ ui[el.dataset.bind] = el.value; render(); };
  });

  const newVehBtn = app.querySelector('[data-action="new-vehicule"]');
  if(newVehBtn) newVehBtn.onclick = ()=>openVehicleModal(null);

  app.querySelectorAll('[data-open-veh]').forEach(c=>c.onclick=()=>openVehicleModal(c.dataset.openVeh));

  const newComptaBtn = app.querySelector('[data-action="new-compta"]');
  if(newComptaBtn) newComptaBtn.onclick = ()=>{
    const date = prompt('Date (AAAA-MM-JJ)', todayISO()); if(date===null) return;
    const type = prompt('Type : achat, vente ou autre', 'autre'); if(type===null) return;
    const tiers = prompt('Tiers (nom)','')||'';
    const montant = parseFloat(prompt('Montant (€)','0'))||0;
    addComptaEntry({date, type, tiers, montant, vehLabel:''});
    persist();
  };
  app.querySelectorAll('[data-action="del-compta"]').forEach(b=>b.onclick=()=>{
    state.compta = state.compta.filter(r=>r.id!==b.dataset.id); persist();
  });

  const addContactBtn = app.querySelector('[data-action="add-contact"]');
  if(addContactBtn) addContactBtn.onclick = ()=>{
    const nom = document.getElementById('ct-nom').value.trim();
    const tel = document.getElementById('ct-tel').value.trim();
    const email = document.getElementById('ct-email').value.trim();
    const vehId = document.getElementById('ct-veh').value;
    const message = document.getElementById('ct-msg').value.trim();
    if(!nom || (!tel && !email)){ toast('⚠ Indique un nom et au moins un téléphone ou un email'); return; }
    state.contacts = state.contacts||[];
    state.contacts.push({id:uid(), date:todayISO(), nom, tel, email, vehId, message, statut:'a_traiter'});
    toast('✔ Demande enregistrée');
    persist();
  };
  app.querySelectorAll('[data-action="toggle-contact"]').forEach(b=>b.onclick=()=>{
    const c = (state.contacts||[]).find(x=>x.id===b.dataset.id); if(!c) return;
    c.statut = c.statut==='traite' ? 'a_traiter' : 'traite';
    persist();
  });
  app.querySelectorAll('[data-action="del-contact"]').forEach(b=>b.onclick=()=>{
    state.contacts = (state.contacts||[]).filter(c=>c.id!==b.dataset.id);
    persist();
  });

  renderModalHandlers();
}

function renderModalHandlers(){
  let modalHost = document.getElementById('main');
  // inject modal after main render
  if(ui.modal){
    modalHost.insertAdjacentHTML('beforeend', renderModalRoot());
  }
  const modalEl = document.getElementById('app');

  modalEl.querySelectorAll('[data-close-overlay]').forEach(o=>o.onclick=(e)=>{ if(e.target===o) closeModal(); });
  const closeBtns = modalEl.querySelectorAll('[data-action="close-modal"]');
  closeBtns.forEach(b=>b.onclick=closeModal);

  modalEl.querySelectorAll('[data-subtab]').forEach(b=>b.onclick=()=>{ ui.vehSubTab=b.dataset.subtab; render(); });

  const saveNewBtn = modalEl.querySelector('[data-action="save-new-vehicle"]');
  if(saveNewBtn) saveNewBtn.onclick = ()=>{
    const data = {};
    modalEl.querySelectorAll('[data-new-field]').forEach(el=>{ data[el.dataset.newField] = el.value; });
    modalEl.querySelectorAll('[data-new-check]').forEach(el=>{ data[el.dataset.newCheck] = el.checked; });
    if(!data.marque){ toast('⚠ Indique au moins la marque du véhicule'); return; }
    const v = Object.assign({id:uid(), statut:'disponible', documents:[], entretien:[], frais:[], photos:[]}, data);
    state.vehicles.push(v);
    if(v.prixAchat){
      addComptaEntry({date:v.dateAchat||todayISO(), type:'achat', tiers:v.vendeurNom||'Vendeur particulier', montant:Number(v.prixAchat)||0, vehLabel:`${v.marque} ${v.modele}`});
    }
    ui.modal=null; ui.openVeh=null;
    toast('✔ Véhicule ajouté');
    persist();
  };

  modalEl.querySelectorAll('[data-field]').forEach(el=>{
    const commit = ()=>{
      const v = getVeh(el.dataset.veh); if(!v) return;
      v[el.dataset.field] = el.value;
      saveState();
    };
    el.onchange = commit;
    if(el.tagName==='INPUT') el.oninput = commit;
  });
  modalEl.querySelectorAll('[data-check]').forEach(el=>{
    el.onchange = ()=>{
      const v = getVeh(el.dataset.veh); if(!v) return;
      v[el.dataset.check] = el.checked;
      saveState();
    };
  });

  const markSoldBtn = modalEl.querySelector('[data-action="mark-sold"]');
  if(markSoldBtn) markSoldBtn.onclick = ()=>{
    const v = getVeh(markSoldBtn.dataset.veh); if(!v) return;
    if(!v.acheteurNom || !v.prixVente){ toast('⚠ Renseigne le nom de l\'acheteur et le prix de vente'); return; }
    v.statut='vendu';
    v.dateVente = v.dateVente || todayISO();
    addComptaEntry({date:v.dateVente, type:'vente', tiers:v.acheteurNom, montant:Number(v.prixVente)||0, vehLabel:`${v.marque} ${v.modele}`});
    toast('✔ Vente enregistrée — certificat & contrat disponibles');
    render();
  };

  const delVehBtn = modalEl.querySelector('[data-action="delete-vehicle"]');
  if(delVehBtn) delVehBtn.onclick = ()=>{
    if(!confirm('Supprimer définitivement ce véhicule et ses données ?')) return;
    state.vehicles = state.vehicles.filter(v=>v.id!==delVehBtn.dataset.id);
    closeModal();
  };

  const addDocBtn = modalEl.querySelector('[data-action="add-doc"]');
  if(addDocBtn) addDocBtn.onclick = ()=>{
    const v = getVeh(addDocBtn.dataset.veh); if(!v) return;
    const nom = document.getElementById('doc-nom').value.trim();
    if(!nom){ toast('⚠ Donne un nom au document'); return; }
    const type = document.getElementById('doc-type').value;
    const note = document.getElementById('doc-note').value;
    v.documents = v.documents||[];
    v.documents.push({id:uid(), nom, type, note, dateAjout:todayISO()});
    persist();
  };
  modalEl.querySelectorAll('[data-action="del-doc"]').forEach(b=>b.onclick=()=>{
    const v = getVeh(b.dataset.veh); if(!v) return;
    v.documents = (v.documents||[]).filter(d=>d.id!==b.dataset.doc);
    persist();
  });

  const addEntBtn = modalEl.querySelector('[data-action="add-entretien"]');
  if(addEntBtn) addEntBtn.onclick = ()=>{
    const v = getVeh(addEntBtn.dataset.veh); if(!v) return;
    const type = document.getElementById('ent-type').value;
    const date = document.getElementById('ent-date').value;
    const km = document.getElementById('ent-km').value;
    const note = document.getElementById('ent-note').value;
    const prochaineDate = document.getElementById('ent-prochaine').value;
    const fait = document.getElementById('ent-fait').checked;
    v.entretien = v.entretien||[];
    v.entretien.push({id:uid(), type, date, km, note, prochaineDate, fait});
    persist();
  };
  modalEl.querySelectorAll('[data-action="del-entretien"]').forEach(b=>b.onclick=()=>{
    const v = getVeh(b.dataset.veh); if(!v) return;
    v.entretien = (v.entretien||[]).filter(e=>e.id!==b.dataset.ent);
    persist();
  });

  const addFraisBtn = modalEl.querySelector('[data-action="add-frais"]');
  if(addFraisBtn) addFraisBtn.onclick = ()=>{
    const v = getVeh(addFraisBtn.dataset.veh); if(!v) return;
    const label = document.getElementById('frais-label').value.trim();
    const montant = parseFloat(document.getElementById('frais-montant').value)||0;
    const date = document.getElementById('frais-date').value;
    if(!label || !montant){ toast('⚠ Indique un libellé et un montant'); return; }
    v.frais = v.frais||[];
    v.frais.push({id:uid(), label, montant, date});
    persist();
  };
  modalEl.querySelectorAll('[data-action="del-frais"]').forEach(b=>b.onclick=()=>{
    const v = getVeh(b.dataset.veh); if(!v) return;
    v.frais = (v.frais||[]).filter(f=>f.id!==b.dataset.frais);
    persist();
  });

  const photoInput = modalEl.querySelector('#photo-input');
  if(photoInput) photoInput.onchange = async ()=>{
    const v = getVeh(ui.openVeh); if(!v) return;
    const files = Array.from(photoInput.files||[]);
    for(const file of files){
      try{
        const dataUrl = await resizeImageFile(file, 900, 0.72);
        v.photos = v.photos||[];
        v.photos.push({id:uid(), data:dataUrl});
      }catch(e){ console.error(e); toast('⚠ Erreur lors du traitement d\'une photo'); }
    }
    persist();
  };
  modalEl.querySelectorAll('[data-action="del-photo"]').forEach(b=>b.onclick=()=>{
    const v = getVeh(b.dataset.veh); if(!v) return;
    v.photos = (v.photos||[]).filter(p=>p.id!==b.dataset.photo);
    persist();
  });

  const printBtn = modalEl.querySelector('[data-action="print-doc"]');
  if(printBtn) printBtn.onclick = ()=>window.print();

  modalEl.querySelectorAll('[data-soc-field]').forEach(el=>{
    el.onchange = ()=>{ state.societe[el.dataset.socField] = el.value; saveState(); };
  });
}

  return `
  <div class="card vcard" style="cursor:default;">
    ${v.photos&&v.photos[0]? `<img src="${v.photos[0].data}" style="width:100%;height:170px;object-fit:cover;display:block;">` : `<div style="width:100%;height:170px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:28px;">🚗</div>`}
    <div class="vcard-top">
      <div class="titre">${v.marque||'—'} ${v.modele||''}</div>
      <div class="sub">${v.annee||'—'} · ${v.energie||'—'} · ${v.boiteVitesse||'—'}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${badge}${v.collection? `<span class="pill pill-amber">${t('collection')}</span>`:''}</div>
    </div>
    <div class="vcard-mid">
      <div><div class="v">${v.kilometrage? Number(v.kilometrage).toLocaleString('fr-FR'):'—'}</div><div class="l">${t('km')}</div></div>
      <div><div class="v">${v.couleur||'—'}</div><div class="l">${t('color')}</div></div>
      <div><div class="v">${v.controleTechniqueOk?'✔':'—'}</div><div class="l">${t('ctOk')}</div></div>
    </div>
    <div style="padding:12px 16px;font-size:12.5px;color:var(--muted);min-height:20px;">${v.description||t('contactForDetails')}</div>
    <div class="vcard-bot">
      <span class="prix">${v.prixVenteAffiche? fmtEUR(v.prixVenteAffiche):t('priceOnRequest')}</span>
      <button class="btn btn-sm btn-accent" data-action="pub-interest" data-veh="${v.id}">${t('imInterested')}</button>
    </div>
  </div>`;
}
function attachPublicHandlers(){
  const app = document.getElementById('app');
  const backBtn = app.querySelector('[data-action="goto-admin"]');
  if(backBtn) backBtn.onclick = goAdmin;
  app.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ ui.lang = b.dataset.lang; render(); });
  const gotoContactBtn = app.querySelector('[data-action="goto-pub-contact"]');
  if(gotoContactBtn) gotoContactBtn.onclick = ()=> document.getElementById('pub-contact-card').scrollIntoView({behavior:'smooth'});
  app.querySelectorAll('[data-action="pub-interest"]').forEach(b=>b.onclick=()=>{
    document.getElementById('pct-veh').value = b.dataset.veh;
    document.getElementById('pub-contact-card').scrollIntoView({behavior:'smooth'});
  });
  const sendBtn = app.querySelector('[data-action="pub-send-contact"]');
  if(sendBtn) sendBtn.onclick = ()=>{
    const nom = document.getElementById('pct-nom').value.trim();
    const tel = document.getElementById('pct-tel').value.trim();
    const email = document.getElementById('pct-email').value.trim();
    const vehId = document.getElementById('pct-veh').value;
    const message = document.getElementById('pct-msg').value.trim();
    if(!nom || (!tel && !email)){ toast(t('fillNameContact')); return; }
    state.contacts = state.contacts||[];
    state.contacts.push({id:uid(), date:todayISO(), nom, tel, email, vehId, message, statut:'a_traiter'});
    saveState();
    toast(t('thanksSent'));
    document.getElementById('pct-nom').value=''; document.getElementById('pct-tel').value='';
    document.getElementById('pct-email').value=''; document.getElementById('pct-msg').value='';
  };
}

/* ============== INIT ============== */
loadState();
</script>
</body>
</html>
